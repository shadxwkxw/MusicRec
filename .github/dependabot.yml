# Еженедельные PR с обновлениями. Каждый проходит весь CI: тесты, аудит, Trivy.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Обновлять только uv.lock: диапазоны в pyproject.toml не трогаем, точные
    # версии и так зафиксированы в lock (иначе — отдельный PR на каждый пакет)
    versioning-strategy: lockfile-only
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /services/online
      - /services/batch
    schedule:
      interval: weekly
    ignore:
      # Python в образе меняем вместе с проектом, а не автоматически
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
