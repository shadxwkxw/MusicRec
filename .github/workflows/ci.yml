name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ── Быстрые проверки без тяжёлых зависимостей ──────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Ruff (version from uv.lock)
        run: |
          RUFF=$(uv export --locked --extra dev --no-hashes --no-emit-project | grep -o '^ruff==[^ ;]*')
          uvx --from "$RUFF" ruff check src services tests scripts airflow --output-format github
          uvx --from "$RUFF" ruff format --check src services tests scripts airflow

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: make install
      - run: make typecheck

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: make install
      - run: make audit

  # ── Тесты ──────────────────────────────────────────────────────
  unit:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - run: make install
      - run: make test-unit

  integration:
    name: Integration tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - run: make install
      - name: Tests with coverage
        run: make coverage
      - name: Coverage summary
        if: always()
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          .venv/bin/coverage report --skip-covered >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: htmlcov/

  postgres:
    name: Integration tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: recommender_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d recommender_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/recommender_test
      DB_URL: postgresql+asyncpg://test:test@localhost:5432/recommender_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - run: make install
      - run: make test-integration
      - name: Models match migrations
        run: make migrate && .venv/bin/alembic check

  smoke:
    name: Smoke (uvicorn + restart + batch CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - run: make install
      - run: make smoke

  airflow-dags:
    name: Airflow DAGs import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DAGs import in the Airflow image without errors
        run: make airflow-check

  # ── Упаковка ───────────────────────────────────────────────────
  build:
    # Намеренно без uv.lock: так ставит пакет конечный пользователь
    name: Wheel build + install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Install wheel into a clean venv and run outside the repo
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/recommender-batch --help
          /tmp/wheel-venv/bin/python -c "
          from recommender.config import settings
          from recommender.interfaces.online.main import app
          assert settings.feature_dim == 82, settings.feature_dim
          print('wheel ok:', app.title)
          "
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  docker:
    name: Docker image (${{ matrix.service }})
    needs: [unit, integration, postgres, smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [online, batch]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: music-recommender-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
