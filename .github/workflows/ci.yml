name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # Сканеры запускаются из образов с закреплённой версией и digest, а не через
  # сторонние actions: тег можно подменить, digest — нет
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  # ── Быстрые проверки без тяжёлых зависимостей ──────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Ruff (version from uv.lock)
        run: |
          RUFF=$(uv export --locked --extra dev --no-hashes --no-emit-project | grep -o '^ruff==[^ ;]*')
          uvx --from "$RUFF" ruff check src services tests scripts airflow --output-format github
          uvx --from "$RUFF" ruff format --check src services tests scripts airflow

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: make install
      - run: make typecheck

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: make install
      - run: make audit

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No secrets in any commit
        # Ложные срабатывания — в .gitleaksignore или комментарием gitleaks:allow
        run: docker run --rm -v "$PWD":/repo "$GITLEAKS_IMAGE" git /repo --redact --no-banner -v

  api-contract:
    name: API contract (docs/openapi.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - run: make install
      - name: Schema matches the code
        run: make openapi-check

  # ── Тесты ──────────────────────────────────────────────────────
  unit:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - run: make install
      - run: make test-unit

  integration:
    name: Integration tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      # ffmpeg — для тестов m4a (без него они пропускаются)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
      - run: make install
      - name: Tests with coverage
        run: make coverage
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            .venv/bin/coverage report --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-html
          path: htmlcov/

  postgres:
    name: Integration tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: recommender_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d recommender_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/recommender_test
      DB_URL: postgresql+asyncpg://test:test@localhost:5432/recommender_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - run: make install
      - run: make test-integration
      - name: Models match migrations
        run: make migrate && .venv/bin/alembic check

  s3-server:
    name: S3 tests on a real server (RustFS)
    runs-on: ubuntu-latest
    services:
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key-123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/health"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      S3_TEST_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: ci-access-key
      AWS_SECRET_ACCESS_KEY: ci-secret-key-123
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - run: make install
      - name: Same tests as with moto, against RustFS
        run: .venv/bin/pytest tests/integration/test_s3.py -v

  smoke:
    name: Smoke (uvicorn + restart + batch CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1
      - run: make install
      - run: make smoke

  e2e-compose:
    name: E2E (docker compose + Postgres + API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Image, migrations, upload, likes, restart, delete
        # Ключ свой на каждый запуск и скрыт в логах: в репозитории ключей нет
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          make e2e-compose E2E_API_KEY="$key"

  airflow-dags:
    name: Airflow DAGs import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: DAGs import in the Airflow image without errors
        run: make airflow-check

  # ── Упаковка ───────────────────────────────────────────────────
  build:
    # Намеренно без uv.lock: так ставит пакет конечный пользователь
    name: Wheel build + install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Install wheel into a clean venv and run outside the repo
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/recommender-batch --help
          /tmp/wheel-venv/bin/python -c "
          from recommender.config import settings
          from recommender.interfaces.online.main import app
          assert settings.feature_dim == 82, settings.feature_dim
          print('wheel ok:', app.title)
          "
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl

  docker:
    name: Docker image (${{ matrix.service }})
    needs: [unit, integration, postgres, smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [online, batch]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          pull: true  # свежий базовый образ: исправления безопасности
          tags: music-recommender-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Vulnerability scan (Trivy)
        # Падает на уязвимостях HIGH/CRITICAL, для которых уже есть исправление:
        # обычно хватает пересборки (apt-get upgrade, свежий базовый образ) или
        # обновления зависимости в uv.lock
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table music-recommender-${{ matrix.service }}:ci | tee trivy.txt
      - name: Scan summary
        if: always()
        run: |
          {
            echo '## Trivy: ${{ matrix.service }}'
            echo '```'
            grep -E '^(Total|[a-z].*\()' trivy.txt || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
