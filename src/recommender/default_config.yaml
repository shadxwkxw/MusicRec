project:
  name: music-recommender

paths:
  data_dir: data
  audio_dir: data/audio
  index_dir: data/index
  models_dir: data/models

database:
  url: ${DB_URL:-sqlite+aiosqlite:///data/recommender.db}

audio:
  sample_rate: 22050
  duration_limit: 120.0    # analyse first N seconds
  n_mfcc: 13
  n_chroma: 12
  n_contrast_bands: 6    # librosa требует fmin*2^n_bands < sr/2; при sr=22050 максимум 6

features:
  # Чем описываются треки для поиска похожих: librosa — 82 признака из аудио,
  # embedding — эмбеддинги предобученной модели (считает `batch embed`,
  # нужен make install-embeddings). После смены источника — rebuild.
  source: ${FEATURE_SOURCE:-librosa}
  embedding_model: laion/clap-htsat-unfused
  embedding_window_seconds: 10.0   # модель видит не больше 10 с — трек режется на окна
  embedding_max_windows: 6         # окон на трек, равномерно по первым duration_limit секундам
  embedding_batch_tracks: 32
  embedding_loaders: 8             # потоков декодирования аудио

index:
  # Каждая сборка индекса — отдельная неизменяемая версия в paths.index_dir/versions,
  # текущая указана в CURRENT. Хранятся последние keep_versions
  keep_versions: 3

recommendation:
  default_limit: 10          # сколько рекомендаций по умолчанию (API и batch --top-n)
  candidate_multiplier: 3    # FAISS ищет limit * N кандидатов, чтобы хватило после фильтрации
  # Параметры до первого тюнинга; после него берутся сохранённые артефакты
  default_metric: cosine         # cosine | euclidean
  default_norm_method: standard  # standard | minmax | robust
  default_boost_weight: 0.3      # вес co-like буста в долях разрыва «ближайший — типичный трек»

tuning:
  n_trials: 50
  timeout: 600               # Optuna timeout, seconds
  eval_k: 10                 # hit@k и MRR@k в оценке
  max_feature_weight: 3.0    # веса групп признаков ищутся в [0, max]
  max_boost_weight: 3.0      # вес буста ищется в [0, max]; 1.0 поднимает типичный трек до ближайшего
  norm_methods: [standard, minmax, robust]
  metrics: [cosine, euclidean]
  # Цель подбора параметров признаков: genre — доля того же жанра среди соседей
  # (с artist filter), likes — leave-one-out по лайкам; auto — genre, если в
  # каталоге хотя бы min_genre_tracks треков с жанром, иначе likes
  objective: auto
  min_genre_tracks: 100
  test_fraction: 0.2         # доля лайков каждого пользователя (и артистов в режиме genre) в отложенной выборке
  seed: 42                   # seed разбиения и Optuna, чтобы результаты воспроизводились

api:
  host: 0.0.0.0
  port: 8000
  tracks_page_size: 50       # GET /tracks: limit по умолчанию
  tracks_page_max: 200       # GET /tracks: максимальный limit
