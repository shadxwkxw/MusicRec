[project]
name = "music-recommender"
version = "0.1.0"
description = "Content-based music recommendation with FAISS + Optuna hyperparameter tuning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "numpy>=1.26,<2.5",
    "scikit-learn>=1.4",
    "librosa>=0.10",
    "faiss-cpu>=1.8",
    "optuna>=3.6",
    "joblib>=1.4",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "prometheus-client>=0.20",
    "mutagen>=1.47",
]

[project.scripts]
recommender-online = "services.online.main:main"
recommender-batch  = "services.batch.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "pip-audit>=2.7",
    "build>=1.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "moto[s3]>=5.0",
]
embeddings = [
    "torch>=2.2",
    "transformers>=4.40",
]

# На Linux (Docker, CI) — CPU-сборка torch: с PyPI там ставится сборка с CUDA и
# библиотеками NVIDIA (~10 ГБ образа), а GPU в контейнере всё равно нет.
# На macOS — обычная сборка с PyPI (ускорение через MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recommender", "services"]

[tool.hatch.build.targets.wheel.force-include]
"src/recommender/default_config.yaml" = "recommender/default_config.yaml"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
# Async SQLAlchemy переключается через greenlet; без этого трассировщик
# (ctrace, по умолчанию на Python < 3.14) теряет строки после await.
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.flake8-bugbear]
# Штатный способ объявлять зависимости и параметры в FastAPI
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query",
]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
# librosa>=1.0 использует синтаксис Python 3.12 (`type X = ...`), который mypy
# не разбирает при python_version = "3.11"; типов у неё всё равно нет.
module = ["librosa", "librosa.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Опциональные зависимости (make install-embeddings): в CI не ставятся, а их
# собственные аннотации местами неверны (декоратор на nn.Module.to) —
# проверяем одинаково с ними и без них.
module = ["torch", "torch.*", "transformers", "transformers.*"]
follow_imports = "skip"
